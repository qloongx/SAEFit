[Arguments]

# Project options
port = 8097
env = main
same_env = Yes
save_results = Yes

project_name = SAEFit-Continuation-Amplitude
result_subdir = multiseed/seed2/stage2
monitor={"metric": "val_loss", "decreasing": 1}

# Resume from Stage 1 timing-focused checkpoint (Stage 2 checkpoint deleted due to space)
resume = results/multiseed/seed2/stage1/09-26__00-21-46---dataset_Pulse_SAEFit/checkpoints/SAEFit-Continuation-Timing-epoch=099-val_loss=0.001.ckpt

# Model options (same as baseline)
model_type = SAEFit
model_options = {"ndim": 250, "nout": 250, "r": 100, "hdl_enc": 60, "hdl_tgt": 50, "hdl_est": 20, "n_param": 9, "t1_m": 0.45, "t2_m": 0.55}

# Dataset (same as baseline)
dataset = Pulse_SAEFit
dataset_options = {"seed": 0, "ratio_train": 0.7, "ratio_test": 0.2}
features_path = ./data

# Training settings
precision = 16
batch_size_test = 120000
batch_size_val = 120000
batch_size_train = 1000

# EarlyStopping
EarlyStopping=False
earlystop_options = {"monitor":"val_loss", "min_delta":0.001, "patience":1, "verbose":0, "mode":"min"}

# Data preprocessing (same as baseline)
centering = False
centering_wid = 15
scaling = 1.0
t_res = 30, 60, 90, 120, 150, 175
a_res = 2, 4, 6, 8, 10
twobases = False
losst = False

# PAPER TABLE 2: Amplitude-Focused Loss Weights
# tau: Moderate (was 5.0 in timing-focused)
tau = 3.0
# tauc: Keep low (classifier good)
tauc = 0.05
# lam: Increased from 0.01 (emphasis on reconstruction/amplitude)
lam = 0.05
k_scale = 1.0
shft1 = 86
shft2 = 151

# Loss functions
loss_type = Regression
loss_options = {"reduction": "mean"}
loss_type2 = Classification

# Evaluation metrics
evaluation_type_1 = Accuracy
evaluation_options_1 = {"task": "multiclass", "num_classes": 2}

evaluation_type_2 = SignalNoiseRatio
evaluation_options_2 = {}

evaluation_type_3 = ConfusionMatrix
evaluation_options_3 = {"task": "multiclass", "num_classes": 2}

control_type = SAEFit

# Training schedule
manual_seed = 2
# nepochs: Full 100 epochs for amplitude-focused continuation
nepochs = 100
init_epochs = 0
check_val_every_n_epochs = 50

# Optimizer (PAPER TABLE 2)
optim_method = AdamW
# learning_rate: Further reduced from 3e-4
learning_rate = 2e-4

# AdamW options
optim_options = {"weight_decay": 2e-5}

# Scheduler
scheduler_method = StepLR
scheduler_options = {"step_size": 25, "gamma": 0.9}

# Hardware
ngpu = 1
nthreads = 2
